<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <title>Card Slider</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>
  <main>
    <div id="btns-container">
      <button id="prev-btn">Prev</button>
      <button id="play-btn">
        <i class='bx bx-play'></i>
      </button>
      <button id="pause-btn">
        <i class='bx bx-pause'></i>
      </button>
      <button id="next-btn">Next</button>
    </div>
    <div class="card bounce">
    <img src="/public/assets/nisringaa_httpss.mj.runLvvdiZJBzpU_A_blank_white_billboard_on_01358edc-c98f-4267-a803-633de81b963d_0.png" alt="Placeholder Image" class="card-image">
      <div class="card-content">
        <h2 class="card-title">Card Title</h2>
        <p class="card-text">Card Description. Lorem ipsum dolor sit, amet consectetur adipisicing elit. Repellendus, porro amet?</p>
        <button class="card-button">Read More</button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
